---
name: Test allowed failures scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          jobs: >-
            {
              "build": {"result": "success", "outputs": {}},
              "flaky-test": {"result": "failure", "outputs": {}}
            }
          allowed-failures: >-
            ["flaky-test"]
      - name: Assert success despite allowed failure
        env:
          ACTUAL_SUCCESS: ${{ steps.action.outputs.success }}
          ACTUAL_FAILURE: ${{ steps.action.outputs.failure }}
          ACTUAL_RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "success: $ACTUAL_SUCCESS"
          echo "failure: $ACTUAL_FAILURE"
          echo "result: $ACTUAL_RESULT"
          if [ "$ACTUAL_SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true when failure is allowed, got '$ACTUAL_SUCCESS'"
            exit 1
          fi
          if [ "$ACTUAL_FAILURE" != "false" ]; then
            echo "FAIL: expected failure=false when failure is allowed, got '$ACTUAL_FAILURE'"
            exit 1
          fi
          if [ "$ACTUAL_RESULT" != "success" ]; then
            echo "FAIL: expected result=success when failure is allowed, got '$ACTUAL_RESULT'"
            exit 1
          fi
          echo "PASS"
