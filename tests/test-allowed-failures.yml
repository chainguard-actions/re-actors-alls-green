---
name: Test allowed-failures - failing job in allowed list does not fail check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          jobs: >-
            {
              "build": {"result": "success", "outputs": {}},
              "flaky-test": {"result": "failure", "outputs": {}}
            }
          allowed-failures: >-
            ["flaky-test"]
      - name: Assert success output is true
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true when failing job is in allowed-failures, got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failure output is false
        env:
          FAILURE: ${{ steps.action.outputs.failure }}
        run: |
          echo "failure: $FAILURE"
          if [ "$FAILURE" != "false" ]; then
            echo "FAIL: expected failure=false when failing job is in allowed-failures, got '$FAILURE'"
            exit 1
          fi
          echo "PASS"
      - name: Assert result output is success
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "FAIL: expected result=success when failing job is in allowed-failures, got '$RESULT'"
            exit 1
          fi
          echo "PASS"
