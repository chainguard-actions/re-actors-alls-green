---
name: Test a required job failed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          jobs: >-
            {
              "build": {"result": "success", "outputs": {}},
              "test-suite": {"result": "failure", "outputs": {}}
            }
      - name: Assert action step failed (required job failed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action step to fail when a required job failed, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed"
      - name: Assert success output is false
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "false" ]; then
            echo "FAIL: expected success=false, got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failure output is true
        env:
          FAILURE: ${{ steps.action.outputs.failure }}
        run: |
          echo "failure: $FAILURE"
          if [ "$FAILURE" != "true" ]; then
            echo "FAIL: expected failure=true, got '$FAILURE'"
            exit 1
          fi
          echo "PASS"
      - name: Assert result output is failure
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "failure" ]; then
            echo "FAIL: expected result=failure, got '$RESULT'"
            exit 1
          fi
          echo "PASS"
