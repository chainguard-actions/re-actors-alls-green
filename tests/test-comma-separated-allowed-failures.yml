---
name: Test comma-separated allowed-failures input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          jobs: >-
            {
              "build": {"result": "success", "outputs": {}},
              "flaky-a": {"result": "failure", "outputs": {}},
              "flaky-b": {"result": "failure", "outputs": {}}
            }
          allowed-failures: "flaky-a, flaky-b"
      - name: Assert success output is true
        env:
          SUCCESS: ${{ steps.action.outputs.success }}
        run: |
          echo "success: $SUCCESS"
          if [ "$SUCCESS" != "true" ]; then
            echo "FAIL: expected success=true with comma-separated allowed-failures, got '$SUCCESS'"
            exit 1
          fi
          echo "PASS"
      - name: Assert result output is success
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "FAIL: expected result=success, got '$RESULT'"
            exit 1
          fi
          echo "PASS"
